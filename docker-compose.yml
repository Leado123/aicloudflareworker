version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: astrodb
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://astro:astro@db:5432/astrodb?schema=public
      PORT: 4321
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "4321:4321"
    # Remove any PostgreSQL install/init logic from your Dockerfile and startup scripts

volumes:
  postgres_data:
